# Place at: .github/workflows/prayer-slack.yml
name: Prayer time Slack messages

on:
  schedule:
    # Monday-Friday, 3 bar (Dhaka time 7:17, 8:47, 10:17).
    # Ekta drop holeo baki gulo cholbe; script duplicate schedule kore na.
    # - cron: "17 1 * * 1-5"
    # - cron: "47 2 * * 1-5"
    # - cron: "17 4 * * 1-5"
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Shudhu log dekhao, Slack-e schedule korbe na"
        type: boolean
        default: true

jobs:
  schedule-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: node prayer-slack.mjs
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
